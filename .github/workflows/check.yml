name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s nightly
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - name: moon check (warnings are errors)
        run: moon check --deny-warn --target all
      - name: moon fmt (no diff)
        # One package at a time: moonfmt needs ~7 GB on a few large files
        # (plugins/arm_gnueabi, plugins/disassemble), and a single parallel
        # `moon fmt --check` exhausts the runner's memory.
        run: |
          find . \( -name moon.pkg -o -name moon.pkg.json \) \
            -not -path './.mooncakes/*' -not -path './_build/*' -exec dirname {} \; |
            sort | while read -r pkg; do
              moon fmt --check "$pkg" || exit 1
            done
